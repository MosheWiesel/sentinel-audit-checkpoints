# Pull Sentinel's public audit checkpoint log, verify it, store new checkpoints
# append-only, and make any failure visible (failed run + open issue).
# The Sentinel server has no credentials for this repository: it can only be read.
name: Replicate audit checkpoints

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: replicate
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install the verifier's two dependencies (pinned)
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download, verify and store new checkpoints
        env:
          SENTINEL_BASE_URL: ${{ vars.SENTINEL_BASE_URL }}
        run: python scripts/replicate.py 2>&1 | tee replicate.log

      - name: Commit new checkpoints
        run: |
          git config user.name "checkpoint-replicator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkpoints
          if ! git diff --cached --quiet; then
            git commit -m "Replicate audit checkpoints ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Daily checkpoint is not overdue
        run: python scripts/check_freshness.py 2>&1 | tee -a replicate.log

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create replication-failure --color B60205 --force >/dev/null 2>&1 || true
          body="Replication failed at $(date -u +%Y-%m-%dT%H:%MZ): $RUN_URL

          \`\`\`
          $(tail -n 25 replicate.log 2>/dev/null)
          \`\`\`"
          number=$(gh issue list --label replication-failure --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Checkpoint replication failing" --label replication-failure --body "$body"
          fi

      - name: Close the failure issue after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label replication-failure --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Replication healthy again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
